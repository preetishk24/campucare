<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CampusCare AI</title>
<style>
:root{--bg:#f6f8fb;--sf:#fff;--tx:#14213d;--mu:#5b6b84;--bd:#dde3ec;--pr:#1d3a78;--pl:#e8eefb;--cr:#b42318;--hi:#c2570c;--md:#8a6d00;--lo:#2f6f4f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--sf:#162036;--tx:#e8edf7;--mu:#9fb0cc;--bd:#2a3a58;--pr:#7aa2ff;--pl:#1f2f52;--cr:#ff8a7a;--hi:#ffa766;--md:#e8c75a;--lo:#6fd1a0;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}nav{width:200px;background:var(--sf);border-right:1px solid var(--bd);padding:14px 10px;flex-shrink:0}
nav h1{font-size:16px;margin:0 6px 2px;color:var(--pr)}nav small{display:block;margin:0 6px 12px;color:var(--mu);font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,nav button:hover{background:var(--pl);color:var(--pr);font-weight:600}
main{flex:1;min-width:0;padding:16px 20px}header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0;font-size:20px}h3{margin:0 0 8px;font-size:14px}select,input,textarea,button.b{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 9px}
button.b{cursor:pointer}button.p{background:var(--pr);color:var(--bg);border-color:var(--pr);font-weight:600}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:0 1px 2px #0001}.m b{font-size:24px;display:block}.m span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}tr.k{cursor:pointer}tr.k:hover{background:var(--pl)}
.t{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid currentColor}.Critical{color:var(--cr)}.High{color:var(--hi)}.Medium{color:var(--md)}.Low{color:var(--lo)}.st{color:var(--pr)}
.mu{color:var(--mu)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar{height:8px;background:var(--pr);border-radius:4px}.note{border-left:3px solid var(--hi);background:var(--pl);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px}
.mp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.bl{border:2px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;background:var(--sf)}.bl.w{border-color:var(--hi)}.bl.x{border-color:var(--cr);border-style:dashed}
.toast{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--pr);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:9}
@media(max-width:700px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:8px}nav h1,nav small{display:none}nav button{width:auto;white-space:nowrap}}
</style></head><body><div class="app"><nav id="nav"></nav><main id="main"></main></div><div id="toast" class="toast" hidden></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NOW=Date.now(),M=m=>NOW-m*6e4;
const S={role:'admin',user:null,auth:'login',msg:'',fails:{},view:'overview',sel:null,log:{},notes:[],
W:{users:.30,svc:.30,urg:.25,wk:.15},
techs:[{n:'Ravi Patil',sk:['Network and Wi-Fi','Security'],av:true},{n:'Neha Kulkarni',sk:['Hardware','Laboratory computers','Printers'],av:true},{n:'Amit Shinde',sk:['Software','College ERP or portal','Account and access'],av:false}],
locs:{'Laboratory 3':'CS Block','Laboratory 2':'CS Block','Library':'Library','Auditorium':'Main Hall'},
assets:[{id:'AST-RTR3',n:'Lab 3 Switch 01',loc:'Laboratory 3',m:200},{id:'AST-PC02',n:'Lab PC 02',loc:'Laboratory 2',m:150},{id:'AST-PC01',n:'Lab PC 01',loc:'Laboratory 2',m:20},{id:'AST-PRJ4',n:'Projector 04',loc:'Auditorium',m:60},{id:'AST-LR1',n:'Library Router 01',loc:'Library',m:30}],
kb:[{id:'KB-1',t:'Lab network outage checklist',cat:'Network and Wi-Fi',k:'wifi internet network lab connectivity portal',steps:['Check whether several devices on the same switch/AP are affected','Inspect switch/AP power and uplink LEDs','Test DHCP lease from a wired device','Escalate to network admin if uplink is down']},{id:'KB-2',t:'PC restarting during heavy apps',cat:'Hardware',k:'restart reboot computer crash development',steps:['Check system logs for unexpected shutdowns','Check CPU temperature and memory usage','Test with other applications','Review recent driver changes','Escalate for hardware inspection if persists']},{id:'KB-3',t:'Projector shows no signal',cat:'Projectors and classroom equipment',k:'projector signal hdmi display',steps:['Reseat HDMI cable','Select correct input source','Test with another laptop']}],
inc:[],T:[]};
const C=['Network and Wi-Fi','Hardware','Software','Laboratory computers','Projectors and classroom equipment','Printers','College ERP or portal','Account and access','Security','Other'];
const SC={'Network and Wi-Fi':1,'College ERP or portal':.9,'Security':.9,'Account and access':.7,'Laboratory computers':.6,'Software':.5,'Hardware':.5,'Projectors and classroom equipment':.6,'Printers':.3,'Other':.3};
const TR={Open:['Triaged','Assigned','Escalated'],Triaged:['Assigned','Escalated'],Assigned:['In Progress','Escalated'],'In Progress':['Resolved','Waiting for Requester','Escalated'],'Waiting for Requester':['In Progress'],Escalated:['Assigned','In Progress'],Resolved:['Closed','Reopened'],Reopened:['Assigned','In Progress'],Closed:[]};
let n=100;const mk=(o)=>Object.assign({id:'T-'+(++n),status:'Open',pri:'Medium',tech:null,user:'Student A',users:1,urg:2,wk:true,asset:null,inc:null,conf:null,res:null,age:60,sub:'',ver:null},o);
[['Wi-Fi is not working in Laboratory 3','Network and Wi-Fi','Laboratory 3','AST-RTR3',15,5,2,false],['Cannot access internet from Lab 3 computers','Network and Wi-Fi','Laboratory 3','AST-RTR3',12,3,3,false],['College portal not opening on Lab 3 network','Network and Wi-Fi','Laboratory 3',null,9,2,2,false],['All computers in Lab 3 lost connectivity','Network and Wi-Fi','Laboratory 3','AST-RTR3',6,25,3,false],
['Single PC keyboard sticky','Hardware','Library',null,300,1,1,true]].forEach((a,i)=>S.T.push(mk({title:a[0],cat:a[1],loc:a[2],asset:a[3],age:a[4],users:a[5],urg:a[6],wk:a[7],user:'Student '+'ABCDE'[i]})));
for(let i=0;i<5;i++)S.T.push(mk({title:['PC restarts when opening IDE','Lab PC 02 freezes randomly','Lab PC 02 blue screen','Lab PC 02 will not boot','Lab PC 02 overheating shutdown'][i],cat:'Laboratory computers',loc:'Laboratory 2',asset:'AST-PC02',age:60*24*(70-i*12),status:i==4?'Resolved':'Closed',tech:'Neha Kulkarni',pri:'Medium',res:'Replaced thermal paste / reseated RAM',ver:i==4?'pending':'confirmed',user:'Faculty '+i,urg:2}));
S.T.push(mk({title:'Projector 04 no signal',cat:'Projectors and classroom equipment',loc:'Auditorium',asset:'AST-PRJ4',age:2000,status:'Resolved',tech:'Neha Kulkarni',res:'Replaced HDMI cable',ver:'pending',user:'Faculty X'}),mk({title:'Printer jam recurring',cat:'Printers',loc:'Library',age:3000,status:'Reopened',tech:'Neha Kulkarni',user:'Student Z'}));
S.accts=[{email:'student@demo.local',pw:'Student#123',name:'Asha Student',role:'student',owner:'Student A',status:'active'},{email:'faculty@demo.local',pw:'Faculty#123',name:'Dr. Faculty',role:'faculty',owner:'Faculty 0',status:'active'},{email:'tech@demo.local',pw:'Tech#12345',name:'Ravi Patil',role:'technician',status:'active'},{email:'admin@demo.local',pw:'Admin#1234',name:'IT Manager',role:'admin',status:'active'}];
const A=t=>S.T.find(x=>x.id==t),log=(t,m)=>{(S.log[t]=S.log[t]||[]).push(new Date().toLocaleTimeString()+' · '+S.role+': '+m)},toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.hidden=false;setTimeout(()=>e.hidden=true,2500)};
const tag=p=>`<span class="t ${p}">${p}</span>`,stb=s=>`<span class="t st">${s}</span>`;
const words=s=>new Set(s.toLowerCase().match(/[a-z0-9]{3,}/g)||[]);
function related(t){return S.T.filter(o=>o.id!=t.id&&!['Closed'].includes(o.status)&&o.cat==t.cat&&o.loc==t.loc&&Math.abs(o.age-t.age)<=60).map(o=>{const a=words(t.title),b=words(o.title),j=[...a].filter(x=>b.has(x)).length/new Set([...a,...b]).size;
const ev=['Same category ('+t.cat+')','Same location ('+t.loc+')','Reported '+Math.abs(o.age-t.age)+' min apart'];let s=.3+.3+.15*(1-Math.abs(o.age-t.age)/60)+.15*j;if(o.asset&&o.asset==t.asset){s+=.1;ev.push('Same asset '+o.asset)}ev.push('Text overlap '+Math.round(j*100)+'%');return{o,s:Math.min(1,s),ev}}).sort((a,b)=>b.s-a.s)}
function impact(t){const rel=t.inc?S.T.filter(x=>x.inc==t.inc).length:0,u=Math.min(1,Math.max(t.users,rel*3)/20),sv=SC[t.cat]||.3,ug=(t.urg-1)/2,wk=t.wk?0:1,W=S.W;
const sc=Math.round(100*(W.users*u+W.svc*sv+W.urg*ug+W.wk*wk));let p=sc>=70?'Critical':sc>=50?'High':sc>=30?'Medium':'Low',ov='';if(t.inc&&S.inc.find(i=>i.id==t.inc)?.confirmed&&sc>=50){p='Critical';ov=' Override: part of a confirmed major incident.'}
return{sc,p,txt:`${p} recommended (score ${sc}/100): ${t.users} affected user(s)${rel?', '+rel+' linked tickets':''}, service criticality ${Math.round(sv*100)}%, urgency ${['low','medium','high'][t.urg-1]}, ${t.wk?'a workaround exists':'no workaround reported'}.${ov}`,rev:sc>=50}}
const open=t=>S.T.filter(x=>x.tech==t&&!['Resolved','Closed'].includes(x.status)).length;
function recTech(t){return S.techs.map(x=>({x,s:(x.sk.includes(t.cat)?50:0)+(x.av?25:0)-open(x.n)*8})).sort((a,b)=>b.s-a.s)}
function risk(a){const ts=S.T.filter(t=>t.asset==a.id),re=ts.filter(t=>t.status=='Reopened').length,why=[];let s=Math.min(60,ts.length*12);if(ts.length)why.push(ts.length+' linked ticket(s)');if(a.m>90){s+=20;why.push('Last maintenance '+a.m+' days ago (>90)')}if(re){s+=10;why.push(re+' reopened')}s=Math.min(100,s);return{s,l:s>=60?'Elevated':s>=35?'Moderate':'Low',why,ts}}
const perm={student:['overview','tickets','map','kb'],faculty:['overview','tickets','map','kb'],technician:['overview','tickets','assets','map','kb'],admin:['overview','tickets','incidents','assets','map','kb','analytics']};
const NAMES={overview:'Overview',tickets:'Tickets',incidents:'Major Incidents',assets:'Equipment & Assets',map:'Campus Map',kb:'Knowledge Base',analytics:'Analytics'};
const go=(v,s)=>{S.view=v;S.sel=s||null;R()},isA=()=>S.role=='admin',isT=()=>S.role=='technician';
function setRole(r){S.role=r;if(!perm[r].includes(S.view))S.view='overview';S.sel=null;R()}
function mine(){return S.role=='student'||S.role=='faculty'?S.T.filter(t=>t.user==S.user.owner):S.role=='technician'?S.T.filter(t=>t.tech=='Ravi Patil'||t.tech=='Neha Kulkarni'):S.T}
function tbl(L){return `<div class="tw"><table><tr><th>ID</th><th>Title</th><th>Location</th><th>Priority</th><th>Status</th><th>Tech</th></tr>${L.map(t=>`<tr class="k" onclick="go('tickets','${t.id}')"><td>${t.id}</td><td>${esc(t.title)}</td><td>${t.loc}</td><td>${tag(t.pri)}</td><td>${stb(t.status)}</td><td>${t.tech||'—'}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">No tickets.</td></tr>'}</table></div>`}
function R(){if(!S.user)return authView();document.getElementById('nav').style.display='';document.getElementById('nav').innerHTML=`<h1>CampusCare AI</h1><small>Synthetic demo data</small>`+perm[S.role].map(v=>`<button class="${S.view==v?'on':''}" onclick="go('${v}')">${NAMES[v]}</button>`).join('');
const V={overview,tickets,incidents,assets,map:cmap,kb,analytics}[S.view];document.getElementById('main').innerHTML=`<header><h2>${NAMES[S.view]}</h2><div class="row"><span class="mu">${esc(S.user.name)} · ${S.role} · /${S.role}/dashboard</span><button class="b" onclick="logout()">Log out</button></div></header>`+V()}
function overview(){const L=mine(),o=L.filter(t=>!['Resolved','Closed'].includes(t.status));const need=o.filter(t=>t.pri=='Critical'||t.pri=='High'||t.age<30&&!t.tech);
return `<div class="g g4"><div class="c m"><b>${L.length}</b><span>Total tickets</span></div><div class="c m"><b>${o.length}</b><span>Open</span></div><div class="c m"><b>${L.filter(t=>t.ver=='pending').length}</b><span>Awaiting confirmation</span></div><div class="c m"><b>${S.inc.filter(i=>i.status!='Closed').length}</b><span>Active major incidents</span></div></div>
<div class="note">Tip: click <b>New ticket</b>, submit the pre-filled Wi-Fi complaint for Laboratory 3, then log out and sign in as admin to review the suggested incident.</div>
<div class="row" style="margin:10px 0"><button class="b p" onclick="go('tickets','new')">+ New ticket</button></div>
<div class="c"><h3>Needs attention</h3>${tbl(need.slice(0,8))}</div>${isA()?pendCard():''}`}
function tickets(){if(S.sel=='new')return form();if(S.sel){const t=A(S.sel);if(!t||!mine().includes(t))return '<div class="note">403 – you do not have access to this ticket.</div>';return detail(t)}return `<div class="row" style="margin-bottom:10px"><button class="b p" onclick="go('tickets','new')">+ New ticket</button></div><div class="c">${tbl(mine())}</div>`}
function form(){return `<div class="c" style="max-width:560px"><h3>Report an IT problem</h3><div class="g"><input id="f_t" placeholder="Title" value="Wi-Fi not working in Laboratory 3"><textarea id="f_d" rows=3 placeholder="Describe the problem"></textarea><select id="f_c">${C.map(c=>`<option ${c=='Network and Wi-Fi'?'selected':''}>${c}</option>`).join('')}</select><select id="f_l">${Object.keys(S.locs).map(l=>`<option ${l=='Laboratory 3'?'selected':''}>${l}</option>`).join('')}</select><label>Users affected <input id="f_u" type="number" min=1 value=1></label><label>Urgency <select id="f_g"><option value=1>Low</option><option value=2 selected>Medium</option><option value=3>High</option></select></label><label><input id="f_w" type="checkbox"> A workaround is available</label><button class="b p" onclick="create()">Submit ticket</button></div></div>`}
function create(){const t=document.getElementById('f_t').value.trim();if(t.length<5)return toast('Title must be at least 5 characters');
const o=mk({title:t,cat:f_c.value,loc:f_l.value,users:+f_u.value||1,urg:+f_g.value,wk:f_w.checked,age:0,user:S.user.owner||S.user.name,asset:f_l.value=='Laboratory 3'&&f_c.value=='Network and Wi-Fi'?'AST-RTR3':null});o.pri=impact(o).p;S.T.unshift(o);log(o.id,'Ticket created');S.notes.push('New ticket '+o.id);toast('Created '+o.id);go('tickets',o.id)}
function detail(t){const im=impact(t),rl=related(t),inc=S.inc.find(i=>i.id==t.inc),ts=recTech(t),kb=copilot(t);
const nx=(TR[t.status]||[]).filter(s=>!(s=='Resolved'&&0));
return `<button class="b" onclick="go('tickets')">← Back</button><div class="g g2" style="margin-top:10px"><div class="c"><h3>${t.id} · ${esc(t.title)}</h3><div class="row">${tag(t.pri)}${stb(t.status)}<span class="mu">${t.cat} · ${t.loc} · ${t.user}${t.asset?' · '+t.asset:''}</span></div>
${inc?`<div class="note">Linked to ${inc.id} (${inc.confirmed?'confirmed shared incident':'suggestion'}). Suspected cause (unverified): ${esc(inc.cause)}</div>`:''}
${t.res?`<p><b>Resolution:</b> ${esc(t.res)}</p>`:''}
${t.ver=='pending'&&!isA()&&!isT()?`<div class="note"><b>Please verify:</b> ${t.cat=='Network and Wi-Fi'?'Can you connect? Can you open the portal? Is it stable?':'Is the problem fixed?'}<div class="row" style="margin-top:6px"><button class="b p" onclick="verify('${t.id}',1)">Confirm resolved</button><button class="b" onclick="verify('${t.id}',0)">Still broken – reopen</button></div></div>`:t.ver=='confirmed'?'<p class="mu">✔ Requester confirmed resolution</p>':''}
${(isA()||isT())?`<h3>Actions</h3><div class="row">${nx.map(s=>s=='Resolved'?'':`<button class="b" onclick="setSt('${t.id}','${s}')">→ ${s}</button>`).join('')}</div>${t.status=='In Progress'?`<div class="g" style="margin-top:8px"><textarea id="rn" rows=2 placeholder="Resolution notes (required)"></textarea><button class="b p" onclick="resolve('${t.id}')">Mark resolved & request confirmation</button></div>`:''}`:''}
<h3 style="margin-top:12px">Activity</h3>${(S.log[t.id]||['(seeded history)']).map(l=>`<div class="mu">${esc(l)}</div>`).join('')}</div>
<div class="g"><div class="c"><h3>Impact-based priority (rule-based)</h3><p>${im.txt}</p><p class="mu">Human review ${im.rev?'recommended':'not required'}.</p>${isA()?`<div class="row"><select id="pp">${['Critical','High','Medium','Low'].map(p=>`<option ${p==t.pri?'selected':''}>${p}</option>`).join('')}</select><button class="b" onclick="setPri('${t.id}',${im.sc})">Set / override</button></div>`:''}</div>
${isA()?`<div class="c"><h3>Related-ticket suggestions</h3>${rl.length?rl.map(r=>`<div style="margin-bottom:8px"><b>${r.o.id}</b> ${esc(r.o.title)} <span class="t st">score ${Math.round(r.s*100)}%</span><div class="mu">${r.ev.join(' · ')}</div></div>`).join('')+(t.inc?'':`<div class="row"><button class="b p" onclick="confirmInc('${t.id}')">Confirm as shared incident</button><button class="b" onclick="toast('Suggestion rejected (logged)');log('${t.id}','Rejected related suggestion')">Reject</button></div><p class="mu">Suggestion only — not a diagnosis.</p>`):'<span class="mu">No related open tickets.</span>'}</div>
<div class="c"><h3>Assign technician</h3>${ts.map((r,i)=>`<div class="row"><b>${r.x.n}</b><span class="mu">${r.x.sk.join(', ')} · ${open(r.x.n)} open · ${r.x.av?'available':'away'}</span>${i==0?'<span class="t st">recommended</span>':''}<button class="b" onclick="assign('${t.id}','${r.x.n}')">Assign</button></div>`).join('')}</div>`:''}
${(isA()||isT())?`<div class="c"><h3>AI Technician Copilot <span class="t st">${kb.src}</span></h3><p class="mu">Rule-based fallback; no LLM key configured. Suggestions, not diagnoses.</p>${kb.a.length?kb.a.map(a=>`<b>${a.id}: ${a.t}</b><ol>${a.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`).join(''):'<p>No matching approved article. General: check logs, reproduce, escalate.</p>'}<div class="mu">Similar resolved: ${S.T.filter(x=>x.cat==t.cat&&x.res&&x.id!=t.id).slice(0,2).map(x=>x.id+' ('+esc(x.res)+')').join('; ')||'none'}</div></div>`:''}</div></div>`}
function copilot(t){const w=words(t.title+' '+t.cat);const a=S.kb.map(k=>({k,s:[...words(k.k)].filter(x=>w.has(x)).length+(k.cat==t.cat?2:0)})).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.k);return{a,src:'knowledge-base match'}}
function setPri(id,sc){const t=A(id),p=pp.value;log(id,`Priority ${t.pri} → ${p} (model score ${sc})`);t.pri=p;toast('Priority updated');R();go('tickets',id)}
function setSt(id,s){const t=A(id);if(!TR[t.status].includes(s))return toast('Invalid transition');log(id,t.status+' → '+s);t.status=s;S.notes.push(id+' now '+s);go('tickets',id)}
function assign(id,n){const t=A(id);t.tech=n;if(t.status=='Open'||t.status=='Triaged')t.status='Assigned';log(id,'Assigned to '+n);S.notes.push(n+' assigned '+id);toast('Assigned');go('tickets',id)}
function resolve(id){const v=rn.value.trim();if(v.length<5)return toast('Resolution notes required');const t=A(id);t.res=v;t.status='Resolved';t.ver='pending';log(id,'Resolved; awaiting requester confirmation');S.notes.push(id+': please confirm resolution');toast('Resolved – confirmation requested');go('tickets',id)}
function verify(id,ok){const t=A(id);if(ok){t.ver='confirmed';t.status='Closed';log(id,'Requester confirmed; closed')}else{t.ver=null;t.status='Reopened';log(id,'Requester reported issue persists; reopened')}toast(ok?'Thanks!':'Reopened');go('tickets',id)}
function confirmInc(id){const t=A(id),rl=related(t).filter(r=>r.s>=.6);let i=S.inc.find(x=>x.loc==t.loc&&x.cat==t.cat&&x.status!='Closed');if(!i){i={id:'INC-'+(S.inc.length+1),title:'Potential shared '+t.cat+' incident – '+t.loc,loc:t.loc,cat:t.cat,status:'Investigating',confirmed:true,cause:'Shared network infrastructure (unverified – needs technician check)',verified:null,owner:'Ravi Patil',t0:Math.max(t.age,...rl.map(r=>r.o.age))};S.inc.push(i)}
[t,...rl.map(r=>r.o)].forEach(x=>{x.inc=i.id;x.pri=impact(x).p;log(x.id,'Linked to '+i.id);S.notes.push(x.id+' linked to '+i.id)});toast(i.id+' confirmed with '+(rl.length+1)+' tickets');go('tickets',id)}
function incidents(){return `<div class="g">${S.inc.map(i=>{const L=S.T.filter(t=>t.inc==i.id);return `<div class="c"><h3>${i.id} · ${esc(i.title)}</h3><div class="row">${stb(i.status)}<span class="t High">Confirmed shared incident</span><span class="mu">${L.length} linked tickets · ${i.loc} · owner ${i.owner} · earliest ${i.t0} min ago</span></div><p><b>Suspected cause:</b> ${esc(i.cause)} <br><b>Verified cause:</b> ${i.verified||'Not yet verified'}</p><p class="mu">Next steps: check switch/AP uplink, DHCP, power. Infrastructure restored ≠ tickets resolved: each requester must still confirm.</p><div class="row"><button class="b" onclick="restore('${i.id}')">Record service restored</button><button class="b" onclick="verifyCause('${i.id}')">Record verified cause</button></div>${tbl(L)}</div>`}).join('')||'<div class="c mu">No incidents yet. Submit the Lab 3 Wi-Fi ticket and confirm the suggestion from its detail page (admin).</div>'}</div>`}
function restore(id){const i=S.inc.find(x=>x.id==id);i.status='Service restored';S.T.filter(t=>t.inc==id).forEach(t=>S.notes.push(t.id+': service restored – please verify'));toast('Restored; linked tickets NOT auto-resolved');R()}
function verifyCause(id){const i=S.inc.find(x=>x.id==id);i.verified='Uplink port failure confirmed by technician (demo entry)';R()}
function assets(){return `<div class="g g2">${S.assets.map(a=>{const r=risk(a);return `<div class="c"><h3>${a.n} <span class="mu">${a.id}</span></h3><div class="row"><span class="t ${r.l=='Elevated'?'High':r.l=='Moderate'?'Medium':'Low'}">${r.l=='Elevated'?'⚠ ':''}${r.l} maintenance risk · ${r.s}</span></div><p class="mu">${a.loc} · ${r.why.join('; ')||'No history'}</p><p class="mu">Rule-based estimate on synthetic data, not a failure prediction.</p><button class="b" onclick="maint('${a.id}')">Record inspection</button></div>`}).join('')}</div>`}
function maint(id){S.assets.find(a=>a.id==id).m=0;toast('Inspection recorded');R()}
function cmap(){return `<div class="mp">${Object.keys(S.locs).map(l=>{const o=S.T.filter(t=>t.loc==l&&!['Resolved','Closed'].includes(t.status)),inc=S.inc.find(i=>i.loc==l&&i.status!='Closed'),fl=S.assets.filter(a=>a.loc==l&&risk(a).l=='Elevated');return `<div class="bl ${inc?'x':o.length>1?'w':''}" onclick="go('tickets')"><b>${l}</b><div class="mu">${S.locs[l]}</div><div>${o.length} open ticket(s)</div>${inc?`<div class="t Critical">⛔ ${inc.id} major incident</div>`:o.length>2?'<div class="t High">▲ Possible shared issue</div>':'<div class="t Low">✔ Normal</div>'}${fl.length?'<div class="t Medium">🔧 Flagged for maintenance</div>':''}</div>`}).join('')}</div><p class="mu">Status uses icons and labels, not color alone.</p>`}
function kb(){return `<div class="g g2">${S.kb.map(k=>`<div class="c"><h3>${k.id} · ${k.t}</h3><div class="mu">${k.cat} · approved</div><ol>${k.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`).join('')}</div>`}
const pwBox=(id,l)=>`<label>${l}<div class="row"><input id="${id}" type="password" style="flex:1"><button type="button" class="b" onclick="const e=document.getElementById('${id}');e.type=e.type=='password'?'text':'password'">Show</button></div></label>`;
const EM=/^[^\s@'"<>]+@[^\s@'"<>]+\.[^\s@'"<>]+$/;
function authView(){document.getElementById('nav').style.display='none';const a=S.auth,sw=x=>`onclick="S.auth='${x}';S.msg='';R()"`;let b='';
if(a=='login')b=`<h3>Sign in</h3><div class="g"><label>Email<input id="l_e" type="email" style="width:100%"></label>${pwBox('l_p','Password')}<button id="lb" class="b p" onclick="login()">Sign In</button><div class="row"><a href="#" ${sw('forgot')}>Forgot password?</a><a href="#" ${sw('signup')}>Create account</a></div></div><p class="mu">Demo accounts (local demo only):</p>${S.accts.filter(x=>x.status=='active'&&['student','faculty','technician','admin'].includes(x.role)).slice(0,4).map(x=>`<button class="b" style="margin:2px" onclick="l_e.value='${x.email}';l_p.value='${x.pw}'">${x.role}</button>`).join('')}`;
else if(a=='signup')b=`<h3>Create account</h3><div class="g"><input id="s_n" placeholder="Full name"><input id="s_e" type="email" placeholder="Email">${pwBox('s_p','Password (8+ chars, upper, lower, digit)')}${pwBox('s_c','Confirm password')}<label>Role<select id="s_r" style="width:100%" onchange="idl.textContent=this.value=='student'?'Student PRN':'Employee ID'"><option>student</option><option>faculty</option><option>technician</option></select></label><input id="s_o" placeholder="College / organization"><input id="s_d" placeholder="Department"><label><span id="idl">Student PRN</span><input id="s_i" style="width:100%"></label><label><input id="s_t" type="checkbox"> I accept the terms and conditions</label><button class="b p" onclick="signup()">Create Account</button><a href="#" ${sw('login')}>Already have an account? Sign in</a></div><p class="mu">Faculty and technician accounts need administrator approval. Administrator accounts cannot be created here.</p>`;
else b=`<h3>Reset password</h3><div class="g"><input id="f_e" type="email" placeholder="Email"><button class="b p" onclick="forgot()">Request reset link</button><a href="#" ${sw('login')}>Back to sign in</a></div>`;
document.getElementById('main').innerHTML=`<div style="max-width:420px;margin:4vh auto"><div class="c"><h1 style="color:var(--pr);margin:0">CampusCare AI</h1><p class="mu">From IT Complaints to Intelligent Resolutions.</p>${S.msg?`<div class="note">${esc(S.msg)}</div>`:''}<div id="ae" role="alert" style="color:var(--cr);min-height:18px"></div>${b}</div></div>`}
const aerr=m=>{document.getElementById('ae').textContent=m};
function login(){const e=l_e.value.trim().toLowerCase(),p=l_p.value;if(!EM.test(e)||!p)return aerr('Enter a valid email and password.');S.fails[e]=S.fails[e]||0;if(S.fails[e]>=5)return aerr('Too many attempts. Try again later.');
const a=S.accts.find(x=>x.email==e);lb.disabled=true;lb.textContent='Signing in…';setTimeout(()=>{if(!a||a.pw!=p){S.fails[e]++;lb.disabled=false;lb.textContent='Sign In';return aerr('Invalid email or password.')}if(a.status!='active'){lb.disabled=false;lb.textContent='Sign In';return aerr('Your account is awaiting administrator approval.')}S.user=a;S.role=a.role;S.view='overview';S.sel=null;S.msg='';R()},400)}
function signup(){const n=s_n.value.trim(),e=s_e.value.trim().toLowerCase(),p=s_p.value,r=s_r.value;if(n.length<2)return aerr('Enter your full name.');if(!EM.test(e))return aerr('Enter a valid email address.');if(p.length<8||!/[A-Z]/.test(p)||!/[a-z]/.test(p)||!/\d/.test(p))return aerr('Password needs 8+ characters with upper, lower and a digit.');if(p!=s_c.value)return aerr('Passwords do not match.');if(!s_i.value.trim())return aerr('ID is required.');if(!s_t.checked)return aerr('Please accept the terms.');if(S.accts.some(x=>x.email==e))return aerr('An account with this email already exists.');
const st=r=='student'?'active':'pending';S.accts.push({email:e,pw:p,name:n,role:r,owner:r=='student'?'Student '+n:r=='faculty'?'Faculty '+n:undefined,status:st,dept:s_d.value,org:s_o.value,eid:s_i.value});S.auth='login';S.msg=st=='active'?'Account created. You can sign in.':'Account created and pending administrator approval.';R()}
function forgot(){if(!EM.test(f_e.value.trim()))return aerr('Enter a valid email address.');S.auth='login';S.msg='If that account exists, a reset has been requested. Email delivery is not configured in this demo, so no email was sent.';R()}
function logout(){S.user=null;S.auth='login';S.msg='You have been signed out.';R()}
function pendCard(){const L=S.accts.filter(a=>a.status=='pending');return `<div class="c" style="margin-top:12px"><h3>Pending registrations</h3>${L.map(a=>`<div class="row">${esc(a.name)} · ${a.role} · ${esc(a.email)}<button class="b p" onclick="approve('${a.email}')">Approve</button></div>`).join('')||'<span class="mu">None</span>'}</div>`}
function approve(e){S.accts.find(a=>a.email==e).status='active';toast('Approved');R()}
function analytics(){const T=S.T,c=f=>T.filter(f).length,pend=c(t=>t.ver=='pending'),conf=c(t=>t.ver=='confirmed'),re=c(t=>t.status=='Reopened');
const grp=(k,L)=>L.map(v=>[v,c(t=>t[k]==v)]).filter(x=>x[1]),mx=a=>Math.max(1,...a.map(x=>x[1])),bars=a=>a.map(x=>`<div class="row"><span style="width:150px">${x[0]}</span><div class="bar" style="width:${x[1]/mx(a)*160}px"></div>${x[1]}</div>`).join('');
return `<div class="g g4"><div class="c m"><b>${T.length}</b><span>Total (count)</span></div><div class="c m"><b>${pend}</b><span>Resolved, awaiting confirmation</span></div><div class="c m"><b>${conf}</b><span>Confirmed resolved</span></div><div class="c m"><b>${re}</b><span>Reopened</span></div></div>
<div class="g g2" style="margin-top:12px"><div class="c"><h3>By priority</h3>${bars(grp('pri',['Critical','High','Medium','Low']))}</div><div class="c"><h3>By location</h3>${bars(grp('loc',Object.keys(S.locs)))}</div><div class="c"><h3>By status</h3>${bars(grp('status',Object.keys(TR)))}</div><div class="c"><h3>Technician workload (open)</h3>${bars(S.techs.map(x=>[x.n,open(x.n)]))}</div>
<div class="c"><h3>Impact weights (configurable)</h3>${Object.keys(S.W).map(k=>`<div class="row"><span style="width:60px">${k}</span><input type="number" step=".05" min=0 max=1 value="${S.W[k]}" onchange="S.W['${k}']=+this.value;toast('Weights updated')"></div>`).join('')}<p class="mu">Confirmation rate: ${conf+pend>=3?Math.round(conf/(conf+pend)*100)+'%':'not enough data'}</p></div></div>`}
R();
</script></body></html>
